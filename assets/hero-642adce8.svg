  <title id="title">Hi! I’m Tianze Yin — Full-stack engineer</title>
  <desc id="desc">Computer Engineering at the University of Waterloo. Web and mobile applications, backend systems, and cloud infrastructure. Centered upright lettering with an ivory-to-copper gradient on charcoal with warm copper accents.</desc>
